[package]
name = "baracuda-cuda-seam"
version = "0.1.0-alpha.117"
description = "FireLine's kernel-seam `Synthesizer` implementation (`BaracudaSynthesizer`) over the CUDA backend in `baracuda-cuda-emit`, as Fuel calls it."

edition.workspace = true
# No `rust-version.workspace = true`: no MSRV CI job builds this crate under 1.88
# (the seam crates' own floor is unmeasured), so declaring it would be an
# untested floor -- see the workspace note.
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cuda", "gpu", "codegen", "nvrtc", "jit"]
categories = ["compilers", "hardware-support"]
homepage.workspace = true
[features]
# Real on-demand NVRTC compile (needs the CUDA toolkit at run time). Off by
# default: the synthesizer then falls back to `unpopped::StubCompiler`.
nvrtc = ["baracuda-cuda-emit/nvrtc"]

# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-cuda-seam --features nvrtc,device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

[dependencies]
baracuda-cuda-emit = { workspace = true }
unpopped = { workspace = true }
unpopped-vocab = { workspace = true }
# The §5 shared wire grammar + live-call envelope: FireLine's published crates (registry versions;
# standing rule: no git deps). `fireline-grammar` carries the region grammar (what was
# `fuel-kernel-seam-types`), `fireline-synth` the `Synthesizer` trait and its request/response
# envelope (what was `fuel-kernel-seam`). `~0.1`, never `^`: each FireLine crate's version follows its
# interface and a 0.x minor is a breaking change. Both crates must resolve to ONE copy each in the
# graph (Fuel's `jit-synth` feature implements the same `fireline_synth::Synthesizer`).
fireline-grammar = "~0.1"
fireline-synth = "~0.1"

[lints]
workspace = true
