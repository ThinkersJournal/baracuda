[package]
name = "baracuda-seam"
version = "0.1.0-alpha.111"
description = "Profile v1 kernel-seam handshake, provider side: Baracuda's advertised SeamHello (over fireline-announce) + the baracuda_seam_hello() entry point a consumer reads to negotiate a seam profile + capabilities."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["cuda", "ffi", "interop", "dlpack"]
categories = ["api-bindings"]

[dependencies]
# The shared envelope, validation, negotiation and wire codec. `~0.1`, never `^`: FireLine's rule
# (each crate's version follows its interface; a 0.x minor is breaking). Dependency-free itself.
fireline-announce = "~0.1"

[lints]
workspace = true
