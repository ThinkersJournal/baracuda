# CodeRipper waivers for this repository. Each entry names one finding and must say why.
# Scope: `version-consistency` only. Every crate in the workspace shares one version
# (`[workspace.package]`) except the four packages below.

# The documented exception to "one version per project" (CHANGELOG.md, "Versioning
# exception"): a crate whose version answers "which version of the other project does
# this work with?" carries that project's MAJOR.MINOR. Both work with `unpopped`.
[[allow]]
check = "WSP-010"
file = "crates/baracuda-cuda-emit/Cargo.toml"
symbol = "baracuda-cuda-emit"
reason = "emitter for Unpopped; MAJOR.MINOR follows the unpopped release it builds against (CHANGELOG 'Versioning exception')"

[[allow]]
check = "WSP-010"
file = "crates/baracuda-cuda-parse/Cargo.toml"
symbol = "baracuda-cuda-parse"
reason = "parser built on unpopped-vocab; MAJOR.MINOR follows the unpopped release it builds against (CHANGELOG 'Versioning exception')"

[[allow]]
check = "WSP-010"
file = "crates/baracuda-cuda-seam/Cargo.toml"
symbol = "baracuda-cuda-seam"
reason = "seam between Unpopped and the baracuda emitters; MAJOR.MINOR follows the unpopped release it builds against (CHANGELOG 'Versioning exception'); repinned to 0.47.1 in #395"

# Not consumed by anyone, never published (`publish = false`): there is no downstream
# who could mistake which crates go together, which is the rule's purpose.
[[allow]]
check = "WSP-010"
file = "examples/Cargo.toml"
symbol = "baracuda-examples"
reason = "publish = false; example binaries, versioned 0.0.0 so no consumer reads it as a family member"

[[allow]]
check = "WSP-010"
file = "xtask/Cargo.toml"
symbol = "xtask"
reason = "publish = false; workspace task runner, versioned 0.0.0 so no consumer reads it as a family member"

# Architecture declaration (ARC-001/002/005; advisory). Read by `coderipper`. Layers are listed bottom first: a crate may depend on
# its own layer or any layer below it. ARCHITECTURE.md ("Layered design") is the prose version: safe plan API over library wrappers,
# CUTLASS and bespoke kernels, over the driver and raw FFI. One component per workspace crate, named by the crate.
[architecture]
style = "layered"
# EFX-001 inputs: no component is tagged `pure = true` (every crate here is an FFI wrapper or a kernel crate that touches the device), so the rule has nothing to check; saying so makes it run and report 0 sites by declaration instead of "not run".
none = ["pure"]

# ARC-003/004/006/007/012 inputs. Policy = the two vocabulary crates that depend on nothing but `unpopped-vocab` (and the derive): baracuda-types
# (dtypes, kernel-arg and status types) and baracuda-cuda-vocab. Infrastructure = every raw `-sys` FFI crate plus baracuda-driver, which
# is the CUDA driver binding. Composition = the `baracuda` facade, the only crate whose job is to wire the wrappers together.
[architecture.volatile]
names = []
namespaces = ["baracuda_cublas_sys::", "baracuda_cuda_sys::", "baracuda_cudf_sys::", "baracuda_cudnn_sys::", "baracuda_cufft_sys::", "baracuda_cufile_sys::", "baracuda_cupti_sys::", "baracuda_curand_sys::", "baracuda_cusolver_sys::", "baracuda_cusparse_sys::", "baracuda_cutensor_sys::", "baracuda_cutlass_kernels_sys::", "baracuda_cutlass_sys::", "baracuda_cuvs_sys::", "baracuda_cvcuda_sys::", "baracuda_flashinfer_sys::", "baracuda_kernels_sys::", "baracuda_nccl_sys::", "baracuda_npp_sys::", "baracuda_nvcomp_sys::", "baracuda_nvimagecodec_sys::", "baracuda_nvjitlink_sys::", "baracuda_nvjpeg_sys::", "baracuda_nvml_sys::", "baracuda_nvrtc_sys::", "baracuda_nvshmem_sys::", "baracuda_ozimmu_sys::", "baracuda_tensorrt_sys::", "baracuda_transformer_engine_sys::", "baracuda_driver::"]
feature_cfg_in_policy = true

[architecture.composition]
roots = ["crates/baracuda/src/lib.rs"]

[architecture.api_budget]
# measured by ARC-006 on 71547fb82: 118 public items and members (types), 42 (vocab); ceilings leave ~10% headroom
baracuda-types = 130
baracuda-cuda-vocab = 50


