# build helpers, vocabulary and codegen inputs that depend on nothing above them
[[architecture.layer]]
name = "foundation"
components = ["baracuda-bench-stats", "baracuda-build", "baracuda-core", "baracuda-cuda-parse", "baracuda-cuda-vocab", "baracuda-forge", "baracuda-seam", "baracuda-types", "baracuda-types-derive"]

# raw FFI crates (*-sys, and the vendored kernel / CUTLASS build crates); may depend on foundation and on each other
[[architecture.layer]]
name = "sys"
components = ["baracuda-cublas-sys", "baracuda-cuda-sys", "baracuda-cudf-sys", "baracuda-cudnn-sys", "baracuda-cufft-sys", "baracuda-cufile-sys", "baracuda-cupti-sys", "baracuda-curand-sys", "baracuda-cusolver-sys", "baracuda-cusparse-sys", "baracuda-cutensor-sys", "baracuda-cutlass-kernels-sys", "baracuda-cutlass-sys", "baracuda-cuvs-sys", "baracuda-cvcuda-sys", "baracuda-flashinfer-sys", "baracuda-kernels-sys", "baracuda-nccl-sys", "baracuda-npp-sys", "baracuda-nvcomp-sys", "baracuda-nvimagecodec-sys", "baracuda-nvjitlink-sys", "baracuda-nvjpeg-sys", "baracuda-nvml-sys", "baracuda-nvrtc-sys", "baracuda-nvshmem-sys", "baracuda-ozimmu-sys", "baracuda-tensorrt-sys", "baracuda-transformer-engine-sys"]

# safe RAII wrappers over one CUDA library each, plus the driver and the shared kernels vocabulary
[[architecture.layer]]
name = "wrappers"
components = ["baracuda-cublas", "baracuda-cudf", "baracuda-cudnn", "baracuda-cufft", "baracuda-cufile", "baracuda-cupti", "baracuda-curand", "baracuda-cusolver", "baracuda-cusparse", "baracuda-cutensor", "baracuda-cuvs", "baracuda-cvcuda", "baracuda-driver", "baracuda-kernels-types", "baracuda-nccl", "baracuda-npp", "baracuda-nvcomp", "baracuda-nvimagecodec", "baracuda-nvjitlink", "baracuda-nvjpeg", "baracuda-nvml", "baracuda-nvrtc", "baracuda-nvshmem", "baracuda-ozimmu", "baracuda-runtime", "baracuda-tensorrt", "baracuda-transformer-engine"]

# crates that combine several wrappers (cutlass, megatron, optim) and the kernel-generation seam
[[architecture.layer]]
name = "composites"
components = ["baracuda-cuda-emit", "baracuda-cuda-seam", "baracuda-cutlass", "baracuda-megatron", "baracuda-optim", "baracuda-tensorrt-builder"]

# baracuda-kernels, the Plan-Descriptor-Args op API
[[architecture.layer]]
name = "plan"
components = ["baracuda-kernels"]

# facade, integrations, benches, examples and the task runner; nothing in the workspace depends on these
[[architecture.layer]]
name = "top"
components = ["baracuda", "baracuda-examples", "baracuda-flashinfer", "baracuda-kernels-bench", "xtask"]


# ARC advisory findings accepted for now. The MOD-* waivers are in the member's own .coderipper.toml (crates/baracuda-driver,
# crates/baracuda-kernels-sys): a member's run reads its own file, not this one. Each is a row in docs/planning/arc-mod-programme.md.

[[allow]]
check = "ARC-005"
file = "crates/baracuda-ozimmu/Cargo.toml"
symbol = "baracuda-ozimmu->baracuda-ozimmu-sys"
reason = "a safe wrapper depends on its own raw FFI crate: `-sys` crates are the stable end of each pair by design (ARCHITECTURE.md, layered design), and ozimmu-sys is unstable only because it depends on kernels-sys, cublas-sys, cuda-sys and forge. Owner: baracuda lane. Remove this entry when ozimmu-sys stops depending on kernels-sys, or when the margin falls under 0.3."
